<style>
.about_hero:has(#zolton-avatar){position:relative;min-height:100vh}

.about_hero:has(#zolton-avatar) > :not(.w-embed){position:relative;z-index:1;pointer-events:none}
/* loading still: Zolton on his cloud straight away (a still rendered from the 3D scene, framed the same way), with a loading
   bar under the cloud that follows the model download; the 3D fades in over it when he's ready */
#zolton-avatar #loader{display:none!important}
#zolton-avatar>canvas{transition:opacity .35s ease}
html.zav-wait #zolton-avatar>canvas{opacity:0}
#zav-still{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;transition:opacity .5s ease}
#zav-still .zb{position:absolute;left:0;top:0;animation:zavBob 2.85s ease-in-out infinite alternate}
#zav-still img{position:absolute;left:0;top:0;max-width:none;opacity:0;transition:opacity .3s ease}
#zav-still img.on{opacity:1}
@keyframes zavBob{from{transform:translateY(var(--b0,0))}to{transform:translateY(var(--b1,0))}}
#zav-load{position:absolute;width:132px;margin-left:-66px;color:rgba(8,34,76,.62);font:500 10px/1 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;transition:opacity .3s}
html.zb-night #zav-load,html[data-mode=dark] #zav-load{color:rgba(226,236,255,.74)}
#zav-load i{position:absolute;left:0;top:0;width:100%;height:1px;background:currentColor;transform-origin:0 0}
#zav-load i:first-child{opacity:.24}
#zav-load i+i{transform:scaleX(0);transition:transform .25s linear}
#zav-load span{display:flex;justify-content:space-between;padding-top:10px;font-variant-numeric:tabular-nums}
#zav-load em{font-style:normal}
@media (prefers-reduced-motion:reduce){#zav-still .zb{animation:none}}
</style>
